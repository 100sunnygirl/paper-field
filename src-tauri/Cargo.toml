[package]
name = "paper-field"
version = "0.2.16"
description = "Paper Field / 论文现场 — local-first research notes"
authors = ["Paper Field"]
edition = "2021"

[lib]
name = "paper_field_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
dunce = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
url = "2"
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "process", "io-util", "time", "rt", "macros", "net"] }
unicode-normalization = "0.1.25"
zip = { version = "2", default-features = false, features = ["deflate"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
# 与 sqlx-sqlite 同一版本（bundled），只用来安装授权回调与预编译检查。
libsqlite3-sys = { version = "=0.30.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"
