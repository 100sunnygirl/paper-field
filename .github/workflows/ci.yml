name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend unit tests
        run: npm test

      # The build script runs tsc before vite build.
      - name: Frontend type check and build
        run: npm run build

      # Share actual assets with Rust's Tauri context, without rebuilding per OS.
      - name: Upload frontend assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-frontend-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  rust:
    name: Rust (${{ matrix.name }})
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
          - name: macOS arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download frontend assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ci-frontend-dist
          path: dist

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - name: Verify native Rust host
        shell: bash
        env:
          EXPECTED_HOST: ${{ matrix.target }}
        run: |
          set -euo pipefail
          rustc -vV
          rustc -vV | grep -Fx "host: $EXPECTED_HOST"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # The action also hashes the compiler and Cargo manifests/lockfile.
          key: ci-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Native Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}

      # Preserve the existing string-slice policy; do not expand to all warnings.
      - name: Rust string-slice lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -A clippy::all -D clippy::string_slice

  gate:
    name: CI Gate
    if: ${{ always() }}
    needs: [frontend, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every validation job to succeed
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          printf 'Frontend: %s\nRust matrix: %s\n' "$FRONTEND_RESULT" "$RUST_RESULT"
          test "$FRONTEND_RESULT" = success
          test "$RUST_RESULT" = success
