name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            toolchain-targets: x86_64-pc-windows-msvc
            tauri-target: x86_64-pc-windows-msvc
            artifact-name: release-assets-Windows
            bundle-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            updater-dir: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis

          - name: macOS universal
            os: macos-15
            toolchain-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-target: universal-apple-darwin
            artifact-name: release-assets-macOS
            bundle-path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            updater-dir: src-tauri/target/universal-apple-darwin/release/bundle/macos

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 发布（tag）构建不读缓存：缓存可被其他分支的构建写入，不能进入带签名密钥的产物。
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: ${{ github.ref_type != 'tag' && 'npm' || '' }}
          # 不让 package.json 的 packageManager 字段触发自动缓存，缓存只由上一行决定。
          package-manager-cache: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, 2026-10
        with:
          targets: ${{ matrix.toolchain-targets }}
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: github.ref_type != 'tag'
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend type check and build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 字符串按字节切片在多字节输入上会 panic（如中文输入法的全角冒号）：全仓库禁止。
      - name: Rust string-slice lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -A clippy::all -D clippy::string_slice

      - name: Build ${{ matrix.name }} installer
        shell: bash
        # 签名密钥只交给 tag 发布构建：main 与手动构建会读缓存，不能同时拿到密钥。
        env:
          APPLE_CERTIFICATE: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ github.ref_type == 'tag' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ github.ref_type == 'tag' && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.ref_type == 'tag' && secrets.APPLE_TEAM_ID || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          set -euo pipefail
          # Signing and notarization run only when the full Apple set is present.
          # A partial set is cleared so an unsigned build still succeeds.
          apple_signed=false
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ] && [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            apple_signed=true
          else
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID || true
          fi
          # createUpdaterArtifacts is true in tauri.conf.json. Without the private
          # key the bundler exits, so unsigned builds turn that flag off.
          updater_signed=false
          updater_flag=false
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            updater_signed=true
            updater_flag=true
          else
            unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD || true
          fi
          npm run tauri build -- --target "${{ matrix.tauri-target }}" --config "{\"bundle\":{\"createUpdaterArtifacts\":${updater_flag}}}"

          stage="bundle-upload"
          rm -rf "$stage"
          mkdir -p "$stage"
          shopt -s nullglob
          installers=(${{ matrix.bundle-path }})
          if (( ${#installers[@]} == 0 )); then
            echo "No installer matched ${{ matrix.bundle-path }}"
            exit 1
          fi
          cp -a "${installers[@]}" "$stage"/
          updaters=("${{ matrix.updater-dir }}"/*.sig "${{ matrix.updater-dir }}"/*.app.tar.gz "${{ matrix.updater-dir }}"/*.nsis.zip)
          if (( ${#updaters[@]} )); then
            cp -a "${updaters[@]}" "$stage"/
          fi
          slug=$(printf '%s' "${{ matrix.name }}" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
          printf '{"appleSigned":%s,"updaterSigned":%s}\n' "$apple_signed" "$updater_signed" > "$stage/meta-${slug}.json"

      - name: Upload installer artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact-name }}
          path: bundle-upload/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Match the dry-run behavior used by CC Switch: manual tag dispatch never publishes.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Validate installers, updater manifest, and checksum
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Glob expansion keeps filenames containing spaces intact.
          windows_installers=(release-assets/*-setup.exe)
          macos_installers=(release-assets/*.dmg)
          if (( ${#windows_installers[@]} != 1 || ${#macos_installers[@]} != 1 )); then
            printf 'Expected one Windows installer and one macOS installer; found %s and %s.\n' \
              "${#windows_installers[@]}" "${#macos_installers[@]}"
            find release-assets -type f -print
            exit 1
          fi

          python3 - << 'PY'
          import datetime, json, os, pathlib, urllib.parse
          root = pathlib.Path("release-assets")
          tag = os.environ["RELEASE_TAG"]
          version = tag[1:] if tag.startswith("v") else tag
          repo = os.environ["RELEASE_REPO"]
          platforms = {}

          def add(platform, archive, signature_path):
              signature = signature_path.read_text(encoding="utf-8").strip()
              url = (
                  f"https://github.com/{repo}/releases/download/"
                  f"{urllib.parse.quote(tag)}/{urllib.parse.quote(archive.name)}"
              )
              platforms[platform] = {"signature": signature, "url": url}

          for archive in root.glob("*.app.tar.gz"):
              sig = pathlib.Path(str(archive) + ".sig")
              if sig.is_file():
                  for platform in ("darwin-aarch64", "darwin-x86_64"):
                      add(platform, archive, sig)
          for archive in root.glob("*.nsis.zip"):
              sig = pathlib.Path(str(archive) + ".sig")
              if sig.is_file():
                  add("windows-x86_64", archive, sig)
          if platforms:
              latest = {
                  "version": version,
                  "notes": f"Paper Field {tag}",
                  "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                  "platforms": platforms,
              }
              (root / "latest.json").write_text(json.dumps(latest, indent=2) + "\n", encoding="utf-8")

          apple = False
          updater = bool(platforms)
          for meta in root.glob("meta-*.json"):
              data = json.loads(meta.read_text(encoding="utf-8"))
              apple = apple or bool(data.get("appleSigned"))
              updater = updater or bool(data.get("updaterSigned"))
              meta.unlink()

          if apple:
              mac = (
                  "- macOS: open the `.dmg` and drag Paper Field to Applications. "
                  "This build was signed with the Apple Developer certificate and submitted for notarization."
              )
          else:
              mac = (
                  "- macOS: open the `.dmg` and drag Paper Field to Applications. "
                  "The app is not notarized; if Gatekeeper blocks it, right-click the app and choose **Open**, "
                  'or run `xattr -dr com.apple.quarantine "/Applications/Paper Field.app"`.'
              )
          if updater and (root / "latest.json").is_file():
              updates = (
                  "- Updates: `latest.json` is attached. In the app, open 设置 and choose **检查更新**. "
                  "The installed app must have been built with the matching updater public key."
              )
          else:
              updates = (
                  "- Updates: this release has no updater signature (`TAURI_SIGNING_PRIVATE_KEY` was not set). "
                  "设置里的「检查更新」stays unavailable until a signed release is published."
              )
          body = "\n".join([
              "Paper Field desktop installers.",
              "",
              "- Windows: run the `-setup.exe` installer. It is unsigned; if SmartScreen appears, choose **More info → Run anyway**.",
              mac,
              updates,
              "- Verify downloads with `SHA256SUMS.txt`.",
              "",
              "macOS and Windows installers are built from the same tagged commit.",
              "",
          ])
          pathlib.Path("release-body.md").write_text(body, encoding="utf-8")
          PY

          cd release-assets
          # nullglob drops updater artifacts when this release was built unsigned.
          hash_files=( *-setup.exe *.dmg *.app.tar.gz *.nsis.zip *.sig )
          if [ -f latest.json ]; then
            hash_files+=( latest.json )
          fi
          sha256sum -- "${hash_files[@]}" > SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Paper Field ${{ github.ref_name }}
          body_path: release-body.md
          files: release-assets/*
          overwrite_files: true
