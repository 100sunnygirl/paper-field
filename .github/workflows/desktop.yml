name: Desktop

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            toolchain-targets: x86_64-pc-windows-msvc
            tauri-target: x86_64-pc-windows-msvc
            artifact-name: release-assets-Windows
            bundle-path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe

          - name: macOS universal
            os: macos-15
            toolchain-targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri-target: universal-apple-darwin
            artifact-name: release-assets-macOS
            bundle-path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.toolchain-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend type check and build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build ${{ matrix.name }} installer
        run: npm run tauri build -- --target ${{ matrix.tauri-target }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.bundle-path }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Match the dry-run behavior used by CC Switch: manual tag dispatch never publishes.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: List downloaded release artifacts
        shell: bash
        run: |
          set -euo pipefail
          ls -la release-assets

      - name: Validate installers and generate checksum
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          # Glob expansion keeps filenames containing spaces intact.
          windows_installers=(release-assets/*-setup.exe)
          macos_installers=(release-assets/*.dmg)
          if (( ${#windows_installers[@]} != 1 || ${#macos_installers[@]} != 1 )); then
            printf 'Expected one Windows installer and one macOS installer; found %s and %s.\n' \
              "${#windows_installers[@]}" "${#macos_installers[@]}"
            find release-assets -type f -print
            exit 1
          fi

          cd release-assets
          sha256sum -- *-setup.exe *.dmg > SHA256SUMS.txt

      - name: Upload Release Assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Paper Field ${{ github.ref_name }}
          body: |
            Paper Field desktop installers.

            - Windows: run the `-setup.exe` installer. It is unsigned; if SmartScreen appears, choose **More info → Run anyway**.
            - macOS: open the `.dmg` and drag Paper Field to Applications. The app is not notarized; if Gatekeeper blocks it, right-click the app and choose **Open**, or run `xattr -dr com.apple.quarantine "/Applications/Paper Field.app"`.
            - Verify downloads with `SHA256SUMS.txt`.

            macOS and Windows installers are built from the same tagged commit.
          files: release-assets/*
          overwrite_files: true
