name: Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend type check and build
        run: npm run build

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows installer
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Create checksum
        shell: pwsh
        run: |
          $artifact = Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $artifact) { throw "NSIS installer was not found" }
          $hash = Get-FileHash $artifact.FullName -Algorithm SHA256
          "$($hash.Hash.ToLower())  $($artifact.Name)" | Out-File -Encoding ascii "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-field-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paper-field-windows-x64
          path: release

      - name: Attach release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $artifact = Get-ChildItem "release" -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $artifact) { throw "NSIS installer was not found" }
          $notes = "Windows installer is unsigned. If SmartScreen appears, choose More info and then Run anyway. Verify SHA256SUMS.txt before redistribution."
          gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --title $env:GITHUB_REF_NAME --notes $notes --verify-tag $artifact.FullName "release/SHA256SUMS.txt"
