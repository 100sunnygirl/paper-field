name: Native desktop smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Native smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15, macos-15-intel]
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/desktop-e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable, 2026-10
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target/desktop-e2e
          shared-key: native-smoke-only
          # This isolated, unsigned test cache never feeds the release workflow.
          cache-on-failure: true
      - run: npm ci
      - name: Verify production excludes instrumentation
        run: npm run test:desktop:guard
      - name: Verify persistence checker detects corruption
        run: python tests/desktop/verify_test.py
      - name: Build instrumented native app (never bundled or signed)
        run: npm run tauri -- build --debug --no-bundle --features desktop-e2e --config tests/desktop/tauri.e2e.conf.json -- --locked
      - name: Native UI, real PDF import, SQLite note, complete process restart
        run: npm run test:desktop
      - name: Upload smoke diagnostics (synthetic data only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-smoke-${{ matrix.os }}
          path: test-results/desktop
          if-no-files-found: ignore
          retention-days: 7
